# Plausibility bounds for the timing engine (Phase 2, docs/specs/phase-2.md section E).
#
# Each row says: a value of `field` on a mechanism driven by a component of `component_category`
# (with `mechanism_kind`), or on a transport of `transport_kind`, is expected between `min` and
# `max`, in the model's unit `unit`. A value outside an active row gives a warning; the design is
# never corrected. A row is active only with `source_url`, `source_title`, and `min` or `max`.
#
# Every number comes from a manufacturer's own public page or catalog. `as_printed` is the value
# and unit exactly as the source prints them; `min` and `max` are that value converted to the
# model's unit (1 m/s = 1000 mm/s, 1 m/s2 = 1000 mm/s2, 1 rpm = 6 deg/s). `source_page` is the
# page number printed on the page. `accessed` is the date the source was read.
#
# Jerk (spec row 6): no manufacturer's page read for this table states a maximum jerk for an axis,
# so there is no jerk row.

- id: pneumatic-cylinder-linear-max-speed
  applies_to:
    component_category: pneumatic_actuator
    transport_kind: null
    mechanism_kind: linear
  field: max_speed
  unit: mm/s
  min: 50
  max: 1000
  as_printed: "Operating piston speed 50 to 1000 mm/s (bore ø32 to ø100); 50 to 700 mm/s (bore ø125)"
  source_title: "SMC, ISO Cylinder ISO Standard (15552) CP96 Series, Specifications"
  source_url: https://ca01.smcworld.com/catalog/ISO/mpv/p-e10-2-isocy-p126-156/data/p-e10-2-isocy-p126-156.pdf
  source_page: "130"
  accessed: 2026-10-29

