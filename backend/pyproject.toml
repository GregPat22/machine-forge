[project]
name = "machine-forge"
version = "0.3.0"
description = "Design automatic machines from a problem statement by prompting, and source their spare parts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.14",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=1.15",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ezdxf>=1.3",
    "hypothesis>=6.100",
    "setuptools>=69",
    "wheel>=0.43",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
