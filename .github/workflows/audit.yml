# Automatic audit of every non-draft pull request (ADR 0020, docs/workflow.md "Audit").
#
# pull_request_target runs this file from the PR's base branch. The audit job runs only when that
# base is main, so the workflow and .github/audit-prompt.md always come from main and a pull
# request cannot change its own audit; changing a PR's base to main starts a new audit, whose
# check replaces any earlier one. No pull request code is checked out or run: the auditor reads
# the PR through the GitHub API and can read files only inside the main checkout. Pull requests
# from forks are skipped, so the API key never reaches them. The audit job can only read GitHub;
# the publish job, which has no API key, posts the report unchanged and sets the "Audit verdict"
# check that the main ruleset requires.
name: Audit

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

jobs:
  audit:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    concurrency:
      group: audit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
    steps:
      # No ref: the base branch, which the job condition requires to be main. Never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The auditor reads the test jobs' results, so wait until they finish (at most 20 minutes).
      - name: Wait for the test jobs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 80); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "backend" or .name == "frontend")]
                    | "\(length) \([.[] | select(.status != "completed")] | length)"' || echo "0 0")
            read -r found pending <<<"$state"
            if [ "$found" -ge 2 ] && [ "$pending" -eq 0 ]; then exit 0; fi
            sleep 15
          done
          echo "The test jobs did not finish in 20 minutes; the auditor will see them as missing."

      - id: prompt
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo 'text<<MF_AUDIT_PROMPT_END'
            cat .github/audit-prompt.md
            echo
            echo "Repository: $GITHUB_REPOSITORY. Pull request: #$PR. Audited commit: $SHA."
            echo "The working directory is main, not the PR: read the PR only with gh pr view $PR"
            echo "and gh pr diff $PR (not its comments), and the test jobs with gh pr checks $PR."
            echo "You cannot run tests here; for check 5, a failing or missing backend or frontend"
            echo "job is a FAIL. The first line of the report must be exactly"
            echo "\"Verdict: <verdict> (commit $SHA)\". Return the verdict and the full report as"
            echo "structured output; do not post anything yourself."
            echo 'MF_AUDIT_PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
            --disallowedTools "WebFetch,WebSearch,Read(./.git/**),Read(//proc/**)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","PASS WITH NOTES","FAIL"]},"report":{"type":"string"}},"required":["verdict","report"],"additionalProperties":false}'

  publish:
    needs: audit
    if: ${{ !cancelled() && needs.audit.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.outputs.result }}
          AUDIT_STATUS: ${{ needs.audit.result }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          verdict=""
          : > report.md
          if [ "$AUDIT_STATUS" = success ] && [ -n "$RESULT" ]; then
            verdict=$(jq -r '.verdict // ""' <<<"$RESULT" 2>/dev/null || true)
            jq -r '.report // ""' <<<"$RESULT" > report.md 2>/dev/null || : > report.md
          fi
          first_line=$(head -n 1 report.md)
          case "$verdict" in
            "PASS"|"PASS WITH NOTES") conclusion=success; title="Verdict: $verdict" ;;
            "FAIL") conclusion=failure; title="Verdict: FAIL" ;;
            *) conclusion=failure; title="The audit did not finish" ;;
          esac
          if [ -n "$verdict" ] && [ "$first_line" != "Verdict: $verdict (commit $SHA)" ]; then
            conclusion=failure
            title="The report's first line does not match the verdict and commit"
          fi
          # The report is the record: post it exactly as the auditor wrote it, unless it looks
          # like it contains an Anthropic key.
          if grep -q 'sk-ant-' report.md; then
            conclusion=failure
            title="Report withheld: it looks like it contains an API key"
          elif grep -q '[^[:space:]]' report.md; then
            if ! gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md; then
              conclusion=failure
              title="The report could not be posted"
            fi
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Audit verdict" -f head_sha="$SHA" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=Audit of $SHA. Report: PR comment. Run: $RUN_URL"
